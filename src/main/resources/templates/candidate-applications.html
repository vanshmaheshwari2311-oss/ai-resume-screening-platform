<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Applications</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#111827}.nav{background:#111827;color:white;padding:20px 5%;display:flex;justify-content:space-between}.nav a{color:white;text-decoration:none;margin-left:18px}.container{width:90%;max-width:1100px;margin:35px auto}.card{background:white;padding:25px;border-radius:16px;box-shadow:0 5px 22px rgba(0,0,0,.07)}table{width:100%;border-collapse:collapse}th,td{padding:14px;text-align:left;border-bottom:1px solid #e5e7eb}.status{font-weight:bold;color:#1d4ed8}.btn{display:inline-block;margin-top:20px;padding:10px 15px;border-radius:8px;background:#2563eb;color:white;text-decoration:none;font-weight:bold}
</style></head>
<body>
<header class="nav"><strong>Candidate Portal</strong><div><a href="/candidate/dashboard">Dashboard</a><a href="/jobs/browse">Jobs</a><a href="/logout">Logout</a></div></header>
<main class="container"><div class="card"><h1>My Applications</h1>
<p th:if="${#lists.isEmpty(applications)}">You have not submitted any applications yet.</p>
<table th:if="${!#lists.isEmpty(applications)}"><thead><tr><th>Job</th><th>Applied At</th><th>Status</th></tr></thead>
<tbody><tr th:each="app : ${apps}"><td th:text="${app.job.title}">Job</td><td th:text="${app.appliedAt}">Date</td><td class="status" th:text="${app.status}">SUBMITTED</td></tr></tbody></table>
<a class="btn" href="/jobs/browse">Browse Jobs</a></div></main>
</body></html>
