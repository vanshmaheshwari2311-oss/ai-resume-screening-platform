<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Job Management - AI Resume Screening</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .header {
            background: #111827;
            color: white;
            padding: 22px 40px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .header p {
            margin: 6px 0 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 1100px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 22px;
            font-size: 21px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #2563eb;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .btn {
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .job {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .job:last-child {
            margin-bottom: 0;
        }

        .job-title {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .job-description {
            color: #4b5563;
            margin-bottom: 12px;
            line-height: 1.5;
        }

        .tag {
            display: inline-block;
            background: #e0ecff;
            color: #1d4ed8;
            padding: 6px 10px;
            border-radius: 20px;
            margin: 3px;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            color: #6b7280;
            padding: 30px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .header {
                padding: 20px;
            }

            .card {
                padding: 20px;
            }

        }

    </style>

</head>

<body>

<div class="header">

    <h1>AI Resume Screening System</h1>

    <p>Job Management</p>

</div>


<div class="container">

    <a href="/resumes" class="back">
        ← Back to Resumes
    </a>


    <!-- CREATE JOB -->

    <div class="card">

        <h2>Create New Job</h2>

        <form action="/jobs/save"
              method="post">

            <div class="form-group">

                <label for="title">
                    Job Title
                </label>

                <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Example: Java Spring Boot Developer"
                        required>

            </div>


            <div class="form-group">

                <label for="description">
                    Job Description
                </label>

                <textarea
                        id="description"
                        name="description"
                        placeholder="Describe the role, responsibilities and requirements..."
                        required></textarea>

            </div>


            <div class="form-group">

                <label for="requiredSkills">
                    Required Skills
                </label>

                <input
                        type="text"
                        id="requiredSkills"
                        name="requiredSkills"
                        placeholder="Java, Spring Boot, MySQL, Docker"
                        required>

            </div>


            <div class="form-group">

                <label for="preferredSkills">
                    Preferred Skills
                </label>

                <input
                        type="text"
                        id="preferredSkills"
                        name="preferredSkills"
                        placeholder="AWS, React, Kubernetes">

            </div>


            <div class="form-group">

                <label for="experience">
                    Experience Required
                </label>

                <input
                        type="text"
                        id="experience"
                        name="experience"
                        placeholder="Example: 1-3 years"
                        required>

            </div>

            <div class="form-group">
                <label for="recruiterName">Recruiter / Contact Name</label>
                <input type="text" id="recruiterName" name="recruiterName"
                       placeholder="Example: Priya Shah">
            </div>

            <div class="form-group">
                <label for="recruiterEmail">Recruiter Contact Email</label>
                <input type="email" id="recruiterEmail" name="recruiterEmail"
                       placeholder="recruiter@company.com">
            </div>

            <div class="form-group">
                <label for="location">Job Location</label>
                <input type="text" id="location" name="location"
                       placeholder="Example: Vadodara / Remote">
            </div>


            <button
                    type="submit"
                    class="btn btn-primary">

                + Create Job

            </button>

        </form>

    </div>


    <!-- SAVED JOBS -->

    <div class="card">

        <h2>Saved Jobs</h2>


        <div th:if="${jobs == null or jobs.isEmpty()}"
             class="empty">

            No jobs created yet.

        </div>


        <div th:each="job : ${jobs}"
             class="job">

            <div class="job-title"
                 th:text="${job.title}">
                Job Title
            </div>


            <div class="job-description"
                 th:text="${job.description}">
                Job description
            </div>


            <strong>
                Required Skills
            </strong>

            <div>

                <span
                        class="tag"
                        th:each="skill : ${#strings.arraySplit(job.requiredSkills, ',')}"
                        th:text="${skill.trim()}">
                    Java
                </span>

            </div>


            <br>


            <strong>
                Preferred Skills
            </strong>

            <div>

                <span
                        class="tag"
                        th:each="skill : ${#strings.arraySplit(job.preferredSkills, ',')}"
                        th:text="${skill.trim()}">
                    AWS
                </span>

            </div>


            <br>


            <strong>
                Experience:
            </strong>

            <span th:text="${job.experience}">
                1-3 years
            </span>

        </div>

    </div>

</div>

</body>

</html>
