name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render and MySQL
        run: |
          curl -f -L --max-time 30 \
            https://ai-resume-screening-platform-04t2.onrender.com/api/keep-alive
