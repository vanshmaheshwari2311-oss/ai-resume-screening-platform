name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render application
        run: |
          echo "Pinging Render..."
          curl -f -L --max-time 30 \
            https://ai-resume-screening-platform-04t2.onrender.com/actuator/health
          echo "Render is responding."